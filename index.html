<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinansialKu - Pencatat Keuangan Ultimate</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://ecoelrgoywqmdiwqasbz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjb2VscmdveXdxbWRpd3Fhc2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMzQzODcsImV4cCI6MjA5NTYxMDM4N30.KL0brutSStLZHV80cOnEZ43DiC8_es25no8SlDkZTIA';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const isSupabaseConfigured = true;

    const formatRupiah = (number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    const formatDate = (dateString) => new Date(dateString).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    const formatInputNumber = (value) => {
      const val = value.replace(/\D/g, ''); 
      return val.replace(/\B(?=(\d{3})+(?!\d))/g, "."); 
    };
    
    // Fungsi baru untuk mengambil tanggal lokal (Sesuai jam HP/Laptop)
    const getTodayLocalString = () => {
      const d = new Date(); 
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getCurrentMonthYear = () => {
      const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    const categories = {
      income: ['Gaji', 'Sampingan', 'Bonus', 'Investasi', 'Iuran Warga', 'Lainnya'],
      expense: ['Makanan', 'Transportasi', 'Belanja', 'Tagihan', 'Hiburan', 'Kesehatan', 'Tabungan', 'Keperluan Bersama', 'Lainnya']
    };

    const getCategoryIcon = (category, type) => {
      if (type === 'income') {
        if (category === 'Gaji') return <i className="fa-solid fa-briefcase text-xl"></i>;
        if (category === 'Iuran Warga') return <i className="fa-solid fa-hand-holding-dollar text-xl"></i>;
        return <i className="fa-solid fa-chart-line text-xl"></i>;
      }
      switch (category) {
        case 'Makanan': return <i className="fa-solid fa-mug-hot text-xl"></i>;
        case 'Transportasi': return <i className="fa-solid fa-car text-xl"></i>;
        case 'Belanja': return <i className="fa-solid fa-bag-shopping text-xl"></i>;
        case 'Tagihan': return <i className="fa-solid fa-house text-xl"></i>;
        case 'Tabungan': return <i className="fa-solid fa-piggy-bank text-xl"></i>;
        case 'Keperluan Bersama': return <i className="fa-solid fa-users text-xl"></i>;
        default: return <i className="fa-solid fa-tag text-xl"></i>;
      }
    };

    function TransactionChart({ transactions, type, isDarkMode }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const filtered = transactions.filter(t => t.type === type);
        if (chartRef.current) chartRef.current.destroy();
        if (filtered.length === 0) return;

        const dataMap = {};
        filtered.forEach(t => { dataMap[t.category] = (dataMap[t.category] || 0) + parseFloat(t.amount); });

        const bgColors = type === 'expense' 
          ? ['#f43f5e', '#8b5cf6', '#3b82f6', '#0ea5e9', '#f59e0b', '#f97316', '#64748b', '#10b981'] 
          : ['#10b981', '#0ea5e9', '#3b82f6', '#8b5cf6', '#64748b'];

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new window.Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(dataMap),
            datasets: [{ data: Object.values(dataMap), backgroundColor: bgColors, borderWidth: 2, borderColor: isDarkMode ? '#1e293b' : '#ffffff' }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'right', labels: { color: isDarkMode ? '#cbd5e1' : '#475569', font: { family: 'sans-serif' } } },
              tooltip: { callbacks: { label: function(c) { return `${c.label}: ${formatRupiah(c.parsed)}`; } } }
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [transactions, type, isDarkMode]);

      return (
        <div className="h-48 w-full flex items-center justify-center">
          {transactions.filter(t => t.type === type).length === 0 ? <p className="text-slate-400 text-sm italic">Belum ada data.</p> : <canvas ref={canvasRef}></canvas>}
        </div>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [authMessage, setAuthMessage] = useState({ text: '', type: '' });
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard | savings | subscriptions | shared | budgets

      // Personal Transaction
      const [transactions, setTransactions] = useState([]);
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState(categories.expense[0]);
      const [date, setDate] = useState(getTodayLocalString());

      const [searchTerm, setSearchTerm] = useState('');
      const [filterMonth, setFilterMonth] = useState('all');
      const [filterYear, setFilterYear] = useState('all');

      // Savings
      const [savingsGoals, setSavingsGoals] = useState([]);
      const [goalTitle, setGoalTitle] = useState('');
      const [goalTarget, setGoalTarget] = useState('');
      const [goalDeadline, setGoalDeadline] = useState('');
      const [topUpModal, setTopUpModal] = useState({ isOpen: false, goalId: null, goalTitle: '' });
      const [topUpAmount, setTopUpAmount] = useState('');

      // Subscriptions
      const [subscriptions, setSubscriptions] = useState([]);
      const [subName, setSubName] = useState('');
      const [subAmount, setSubAmount] = useState('');
      const [subDate, setSubDate] = useState('1'); 
      const [subCategory, setSubCategory] = useState('Tagihan');

      // Budgets (Anggaran)
      const [budgets, setBudgets] = useState([]);
      const [budgetCat, setBudgetCat] = useState(categories.expense[0]);
      const [budgetAmount, setBudgetAmount] = useState('');

      // Shared Wallet
      const [sharedWallet, setSharedWallet] = useState(null);
      const [sharedTransactions, setSharedTransactions] = useState([]);
      const [newSharedName, setNewSharedName] = useState('');
      const [joinCodeInput, setJoinCodeInput] = useState('');
      
      const [sharedType, setSharedType] = useState('expense');
      const [sharedAmount, setSharedAmount] = useState('');
      const [sharedDesc, setSharedDesc] = useState('');
      const [sharedCat, setSharedCat] = useState(categories.expense[0]);
      const [sharedTxDate, setSharedTxDate] = useState(getTodayLocalString());

      // Dark mode toggle
      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('darkMode') === 'true');
      useEffect(() => {
        if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('darkMode', 'true'); } 
        else { document.documentElement.classList.remove('dark'); localStorage.setItem('darkMode', 'false'); }
      }, [isDarkMode]);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => { if (session) { setUser(session.user); setIsLoggedIn(true); } });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session) { setUser(session.user); setIsLoggedIn(true); } else { setUser(null); setIsLoggedIn(false); }
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!isLoggedIn || !user) return;
        const fetchData = async () => {
          setIsLoading(true);
          
          // Data Personal
          const txRes = await supabase.from('transactions').select('*').eq('user_email', user.email).order('date', { ascending: false });
          if (txRes.data) setTransactions(txRes.data);
          
          const svRes = await supabase.from('savings_goals').select('*').eq('user_email', user.email).order('created_at', { ascending: true });
          if (svRes.data) setSavingsGoals(svRes.data);
          
          const subRes = await supabase.from('subscriptions').select('*').eq('user_email', user.email).order('due_date', { ascending: true });
          if (subRes.data) setSubscriptions(subRes.data);

          const bgRes = await supabase.from('budgets').select('*').eq('user_email', user.email).order('created_at', { ascending: true });
          if (bgRes.data) setBudgets(bgRes.data);
          
          // Data Dompet Bersama
          const memberRes = await supabase.from('shared_wallet_members').select('wallet_id').eq('user_email', user.email);
          if (memberRes.data && memberRes.data.length > 0) {
            const wId = memberRes.data[0].wallet_id;
            const walletRes = await supabase.from('shared_wallets').select('*').eq('id', wId).single();
            if (walletRes.data) {
              setSharedWallet(walletRes.data);
              const stxRes = await supabase.from('shared_transactions').select('*').eq('wallet_id', wId).order('date', { ascending: false });
              if (stxRes.data) setSharedTransactions(stxRes.data);
            }
          }
          setIsLoading(false);
        };
        fetchData();
      }, [isLoggedIn, user]);

      const availableYears = useMemo(() => {
        const years = transactions.map(t => new Date(t.date).getFullYear());
        return [...new Set(years)].sort((a, b) => b - a);
      }, [transactions]);

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchesSearch = t.description.toLowerCase().includes(searchTerm.toLowerCase()) || t.category.toLowerCase().includes(searchTerm.toLowerCase());
          const txDate = new Date(t.date);
          const txMonth = (txDate.getMonth() + 1).toString().padStart(2, '0');
          const matchesMonth = filterMonth === 'all' || txMonth === filterMonth;
          const matchesYear = filterYear === 'all' || txDate.getFullYear().toString() === filterYear;
          return matchesSearch && matchesMonth && matchesYear;
        });
      }, [transactions, searchTerm, filterMonth, filterYear]);

      const { totalIncome, totalExpense, balance } = useMemo(() => {
        return filteredTransactions.reduce((acc, curr) => {
          const numAmount = parseFloat(curr.amount);
          if (curr.type === 'income') { acc.totalIncome += numAmount; acc.balance += numAmount; } 
          else { acc.totalExpense += numAmount; acc.balance -= numAmount; }
          return acc;
        }, { totalIncome: 0, totalExpense: 0, balance: 0 });
      }, [filteredTransactions]);

      // Kalkulasi khusus untuk Limit Anggaran (Hanya bulan berjalan)
      const currentMonthExpenses = useMemo(() => {
        const currentMonthYear = getCurrentMonthYear(); 
        return transactions.reduce((acc, tx) => {
          if (tx.type === 'expense' && tx.date.startsWith(currentMonthYear)) {
            acc[tx.category] = (acc[tx.category] || 0) + parseFloat(tx.amount);
          }
          return acc;
        }, {});
      }, [transactions]);

      const totalSavingsCollected = useMemo(() => savingsGoals.reduce((sum, goal) => sum + parseFloat(goal.current_amount || 0), 0), [savingsGoals]);

      const handleExportCSV = () => {
        if (filteredTransactions.length === 0) return;
        const headers = ['Tanggal', 'Tipe', 'Kategori', 'Keterangan', 'Nominal (Rp)'];
        const csvRows = filteredTransactions.map(t => [ t.date, t.type === 'income' ? 'Pemasukan' : 'Pengeluaran', t.category, `"${t.description}"`, t.amount ]);
        const csvContent = headers.join(',') + '\n' + csvRows.map(row => row.join(',')).join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Laporan_FinansialKu.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const numericAmount = parseFloat(amount.replace(/\./g, ''));
        if (!numericAmount || !description || !category || !date) return;
        
        setIsLoading(true);
        const newTx = { type, amount: numericAmount, description, category, date, user_email: user.email };
        const { data, error } = await supabase.from('transactions').insert([newTx]).select();
        if (error) alert("Gagal menyimpan data.");
        else { 
          setTransactions(prev => [data[0], ...prev].sort((a,b) => new Date(b.date) - new Date(a.date))); 
          setAmount(''); 
          setDescription(''); 
          setDate(getTodayLocalString()); // Reset ke hari ini setelah submit
        }
        setIsLoading(false);
      };

      const handleDelete = async (id) => {
        const { data, error } = await supabase.from('transactions').delete().eq('id', id).select();
        if (error || (data && data.length === 0)) alert("Gagal menghapus data! Cek izin Supabase.");
        else setTransactions(transactions.filter(t => t.id !== id));
      };

      // FUNGSI ANGGARAN BULANAN (BUDGETS)
      const handleSaveBudget = async (e) => {
        e.preventDefault();
        const numAmount = parseFloat(budgetAmount.replace(/\./g, ''));
        if (!numAmount || !budgetCat) return;

        setIsLoading(true);
        const existingBudget = budgets.find(b => b.category === budgetCat);

        if (existingBudget) {
          // Update jika sudah ada
          const { data, error } = await supabase.from('budgets').update({ amount: numAmount }).eq('id', existingBudget.id).select();
          if (data && !error) setBudgets(budgets.map(b => b.id === existingBudget.id ? data[0] : b));
          else alert("Gagal memperbarui anggaran.");
        } else {
          // Insert jika belum ada
          const newBg = { category: budgetCat, amount: numAmount, user_email: user.email };
          const { data, error } = await supabase.from('budgets').insert([newBg]).select();
          if (data && !error) setBudgets([...budgets, data[0]]);
          else alert("Gagal menyimpan anggaran baru.");
        }
        setBudgetAmount('');
        setIsLoading(false);
      };

      const handleDeleteBudget = async (id) => {
        const { error } = await supabase.from('budgets').delete().eq('id', id);
        if (!error) setBudgets(budgets.filter(b => b.id !== id));
      };

      const createSharedWallet = async (e) => {
        e.preventDefault();
        if(!newSharedName) return;
        setIsLoading(true);
        const joinCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        
        const { data: wData, error: wErr } = await supabase.from('shared_wallets').insert([{ name: newSharedName, join_code: joinCode, created_by: user.email }]).select();
        if (wData) {
          await supabase.from('shared_wallet_members').insert([{ wallet_id: wData[0].id, user_email: user.email }]);
          setSharedWallet(wData[0]); setSharedTransactions([]); setNewSharedName('');
        } else alert("Gagal membuat dompet.");
        setIsLoading(false);
      };

      const joinSharedWallet = async (e) => {
        e.preventDefault();
        if(!joinCodeInput) return;
        setIsLoading(true);
        const code = joinCodeInput.trim().toUpperCase();
        const { data: wData } = await supabase.from('shared_wallets').select('*').eq('join_code', code).single();
        
        if (wData) {
          const { data: existing } = await supabase.from('shared_wallet_members').select('*').eq('wallet_id', wData.id).eq('user_email', user.email);
          if(!existing || existing.length === 0) await supabase.from('shared_wallet_members').insert([{ wallet_id: wData.id, user_email: user.email }]);
          setSharedWallet(wData);
          const { data: stxData } = await supabase.from('shared_transactions').select('*').eq('wallet_id', wData.id).order('date', { ascending: false });
          if (stxData) setSharedTransactions(stxData);
          setJoinCodeInput('');
        } else alert("Kode dompet tidak valid atau tidak ditemukan.");
        setIsLoading(false);
      };

      const leaveSharedWallet = async () => {
        if(!sharedWallet || !confirm("Yakin ingin keluar dari dompet ini?")) return;
        setIsLoading(true);
        await supabase.from('shared_wallet_members').delete().eq('wallet_id', sharedWallet.id).eq('user_email', user.email);
        setSharedWallet(null); setSharedTransactions([]);
        setIsLoading(false);
      };

      const submitSharedTransaction = async (e) => {
        e.preventDefault();
        const numericAmount = parseFloat(sharedAmount.replace(/\./g, ''));
        if (!numericAmount || !sharedDesc || !sharedCat || !sharedTxDate || !sharedWallet) return;
        
        setIsLoading(true);
        const newTx = { wallet_id: sharedWallet.id, user_email: user.email, type: sharedType, amount: numericAmount, description: sharedDesc, category: sharedCat, date: sharedTxDate };
        const { data, error } = await supabase.from('shared_transactions').insert([newTx]).select();
        
        if (error) alert("Gagal menyimpan transaksi bersama.");
        else { 
          setSharedTransactions(prev => [data[0], ...prev].sort((a,b) => new Date(b.date) - new Date(a.date))); 
          setSharedAmount(''); 
          setSharedDesc(''); 
          setSharedTxDate(getTodayLocalString()); // Reset ke hari ini setelah submit
        }
        setIsLoading(false);
      };

      const deleteSharedTransaction = async (id) => {
        const { error } = await supabase.from('shared_transactions').delete().eq('id', id);
        if (!error) setSharedTransactions(sharedTransactions.filter(t => t.id !== id));
      };

      const { sharedIncome, sharedExpense, sharedBalance } = useMemo(() => {
        return sharedTransactions.reduce((acc, curr) => {
          const numAmount = parseFloat(curr.amount);
          if (curr.type === 'income') { acc.sharedIncome += numAmount; acc.sharedBalance += numAmount; } 
          else { acc.sharedExpense += numAmount; acc.sharedBalance -= numAmount; }
          return acc;
        }, { sharedIncome: 0, sharedExpense: 0, sharedBalance: 0 });
      }, [sharedTransactions]);

      // --- Tabungan ---
      const handleCreateGoal = async (e) => {
        e.preventDefault();
        const numTarget = parseFloat(goalTarget.replace(/\./g, ''));
        if (!goalTitle || !numTarget) return;
        setIsLoading(true);
        const { data, error } = await supabase.from('savings_goals').insert([{ title: goalTitle, target_amount: numTarget, current_amount: 0, deadline: goalDeadline || null, user_email: user.email }]).select();
        if (data && !error) { setSavingsGoals([...savingsGoals, data[0]]); setGoalTitle(''); setGoalTarget(''); setGoalDeadline(''); }
        setIsLoading(false);
      };

      const handleDeleteGoal = async (id) => {
        const { error } = await supabase.from('savings_goals').delete().eq('id', id);
        if (!error) setSavingsGoals(savingsGoals.filter(g => g.id !== id));
      };

      const handleTopUpSubmit = async (e) => {
        e.preventDefault();
        const topUpVal = parseFloat(topUpAmount.replace(/\./g, ''));
        if (!topUpVal || topUpVal <= 0) return;
        setIsLoading(true);
        const goal = savingsGoals.find(g => g.id === topUpModal.goalId);
        const newCurrent = parseFloat(goal.current_amount) + topUpVal;

        const { data: updatedData } = await supabase.from('savings_goals').update({ current_amount: newCurrent }).eq('id', goal.id).select();
        const txDate = getTodayLocalString();
        const newTx = { type: 'expense', amount: topUpVal, description: `Nabung: ${goal.title}`, category: 'Tabungan', date: txDate, user_email: user.email };
        const { data: txData } = await supabase.from('transactions').insert([newTx]).select();

        if (updatedData) {
          setSavingsGoals(savingsGoals.map(g => g.id === goal.id ? { ...g, current_amount: newCurrent } : g));
          if(txData) setTransactions(prev => [txData[0], ...prev].sort((a,b) => new Date(b.date) - new Date(a.date)));
          setTopUpModal({ isOpen: false, goalId: null, goalTitle: '' }); setTopUpAmount('');
        }
        setIsLoading(false);
      };

      // --- Langganan Rutin ---
      const handleCreateSubscription = async (e) => {
        e.preventDefault();
        const numericAmount = parseFloat(subAmount.replace(/\./g, ''));
        if (!subName || !numericAmount || !subDate) return;
        setIsLoading(true);
        const newSub = { name: subName, amount: numericAmount, due_date: parseInt(subDate), category: subCategory, last_paid_month: null, user_email: user.email };
        const { data, error } = await supabase.from('subscriptions').insert([newSub]).select();
        if (data && !error) { setSubscriptions([...subscriptions, data[0]].sort((a,b) => a.due_date - b.due_date)); setSubName(''); setSubAmount(''); setSubDate('1'); }
        setIsLoading(false);
      };

      const handleDeleteSubscription = async (id) => {
        const { error } = await supabase.from('subscriptions').delete().eq('id', id);
        if (!error) setSubscriptions(subscriptions.filter(s => s.id !== id));
      };

      const handlePaySubscription = async (sub) => {
        if (!confirm(`Bayar tagihan ${sub.name} sebesar ${formatRupiah(sub.amount)} sekarang? Ini otomatis memotong saldo utama.`)) return;
        setIsLoading(true);
        const currentMonthYear = getCurrentMonthYear();
        const { data: subData, error: err1 } = await supabase.from('subscriptions').update({ last_paid_month: currentMonthYear }).eq('id', sub.id).select();
        const txDate = getTodayLocalString();
        const newTx = { type: 'expense', amount: sub.amount, description: `Bayar Rutin: ${sub.name}`, category: sub.category, date: txDate, user_email: user.email };
        const { data: txData, error: err2 } = await supabase.from('transactions').insert([newTx]).select();

        if (!err1 && !err2 && subData) {
          setSubscriptions(subscriptions.map(s => s.id === sub.id ? { ...s, last_paid_month: currentMonthYear } : s));
          if(txData) setTransactions(prev => [txData[0], ...prev].sort((a,b) => new Date(b.date) - new Date(a.date)));
          alert(`Berhasil membayar ${sub.name}!`);
        }
        setIsLoading(false);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMessage({ text: '', type: '' });
        setIsLoading(true);
        try {
          if (authMode === 'register') {
            const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { name } } });
            if (error) throw error;
            if (!data.user) throw new Error("Pendaftaran ditolak sistem.");
            setAuthMessage({ text: 'Pendaftaran berhasil! Silakan login.', type: 'success' });
            setAuthMode('login');
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
        } catch (err) { setAuthMessage({ text: err.message, type: 'error' }); }
        setIsLoading(false);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">

                              <span className={`text-sm font-bold ${textColor}`}>{percentage.toFixed(0)}%</span>
                            </div>

                            <div className="h-3 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full transition-all duration-1000 ${barColor}`} style={{ width: `${percentage}%` }}></div>
                            </div>
                            
                            {isOver && (
                              <p className="text-xs font-medium text-rose-500 mt-3 flex items-center gap-1"><i className="fa-solid fa-circle-exclamation"></i> Anda telah melewati batas anggaran bulan ini!</p>
                            )}
                          </div>
                        )
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</body>
</html>
