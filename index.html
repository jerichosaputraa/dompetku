<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinansialKu - Pencatat Keuangan</title>
  
  <!-- 1. Tailwind CSS (Desain Visual) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. FontAwesome (Ikon Visual) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 3. React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 4. Babel (Penerjemah Kode React) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 5. Supabase Database -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // =========================================================================
    // 🔴 PASTE URL DAN KEY SUPABASE ANDA DI SINI 🔴
    // (Ganti teks di dalam tanda kutip dengan milik Anda dari dashboard Supabase)
    // =========================================================================
    const SUPABASE_URL = 'PASTE_PROJECT_URL_ANDA_DI_SINI';
    const SUPABASE_KEY = 'PASTE_ANON_KEY_ANDA_DI_SINI';
    
    // Inisialisasi Supabase
    let supabase = null;
    let isSupabaseConfigured = SUPABASE_URL !== 'PASTE_PROJECT_URL_ANDA_DI_SINI';
    
    if (isSupabaseConfigured) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // --- Format Bantuan ---
    const formatRupiah = (number) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    };

    const formatDate = (dateString) => {
      return new Date(dateString).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    const categories = {
      income: ['Gaji', 'Sampingan', 'Bonus', 'Investasi', 'Lainnya'],
      expense: ['Makanan', 'Transportasi', 'Belanja', 'Tagihan', 'Hiburan', 'Kesehatan', 'Lainnya']
    };

    const getCategoryIcon = (category, type) => {
      if (type === 'income') {
        if (category === 'Gaji') return <i className="fa-solid fa-briefcase text-xl"></i>;
        return <i className="fa-solid fa-chart-line text-xl"></i>;
      }
      switch (category) {
        case 'Makanan': return <i className="fa-solid fa-mug-hot text-xl"></i>;
        case 'Transportasi': return <i className="fa-solid fa-car text-xl"></i>;
        case 'Belanja': return <i className="fa-solid fa-bag-shopping text-xl"></i>;
        case 'Tagihan': return <i className="fa-solid fa-house text-xl"></i>;
        default: return <i className="fa-solid fa-tag text-xl"></i>;
      }
    };

    function App() {
      // State Aplikasi
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [authMode, setAuthMode] = useState('login'); 
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [authMessage, setAuthMessage] = useState({ text: '', type: '' });
      
      const [user, setUser] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      const [transactions, setTransactions] = useState([]);
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState(categories.expense[0]);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

      // 1. Cek Sesi Login saat website dibuka
      useEffect(() => {
        if (!isSupabaseConfigured) return;

        supabase.auth.getSession().then(({ data: { session } }) => {
          if (session) {
            setUser(session.user);
            setIsLoggedIn(true);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session) {
            setUser(session.user);
            setIsLoggedIn(true);
          } else {
            setUser(null);
            setIsLoggedIn(false);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      // 2. Ambil Data Transaksi dari Supabase jika sudah login
      useEffect(() => {
        if (!isSupabaseConfigured || !isLoggedIn || !user) return;
        
        const fetchTransactions = async () => {
          setIsLoading(true);
          const { data, error } = await supabase
            .from('transactions')
            .select('*')
            .eq('user_email', user.email)
            .order('date', { ascending: false });

          if (error) console.error("Error ambil data:", error);
          else if (data) setTransactions(data);
          
          setIsLoading(false);
        };

        fetchTransactions();
      }, [isLoggedIn, user]);

      // Kalkulasi Uang
      const { totalIncome, totalExpense, balance } = useMemo(() => {
        return transactions.reduce((acc, curr) => {
          const numAmount = parseFloat(curr.amount);
          if (curr.type === 'income') {
            acc.totalIncome += numAmount; acc.balance += numAmount;
          } else {
            acc.totalExpense += numAmount; acc.balance -= numAmount;
          }
          return acc;
        }, { totalIncome: 0, totalExpense: 0, balance: 0 });
      }, [transactions]);

      // Simpan Transaksi Baru
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!amount || !description || !category || !date || !isSupabaseConfigured) return;

        setIsLoading(true);
        const newTransaction = {
          type, 
          amount: parseFloat(amount), 
          description, 
          category, 
          date,
          user_email: user.email
        };

        const { data, error } = await supabase
          .from('transactions')
          .insert([newTransaction])
          .select();

        if (error) {
          console.error("Gagal simpan:", error);
          alert("Gagal menyimpan data. Pastikan tabel 'transactions' sudah dibuat di Supabase.");
        } else if (data) {
          setTransactions(prev => [data[0], ...prev].sort((a,b) => new Date(b.date) - new Date(a.date)));
          setAmount(''); setDescription('');
        }
        setIsLoading(false);
      };

      // Hapus Transaksi
      const handleDelete = async (id) => {
        if (!isSupabaseConfigured) return;
        
        const { error } = await supabase.from('transactions').delete().eq('id', id);
        if (!error) setTransactions(transactions.filter(t => t.id !== id));
      };

      // Proses Login / Daftar
      const handleAuth = async (e) => {
        e.preventDefault();
        if (!isSupabaseConfigured) {
          setAuthMessage({ text: "Error: URL/Key Supabase belum diisi di kode HTML.", type: 'error' });
          return;
        }

        setAuthMessage({ text: '', type: '' });
        setIsLoading(true);

        if (authMode === 'register') {
          const { error } = await supabase.auth.signUp({
            email, password, options: { data: { name } }
          });
          if (error) setAuthMessage({ text: error.message, type: 'error' });
          else {
            setAuthMessage({ text: 'Pendaftaran berhasil! Silakan login.', type: 'success' });
            setAuthMode('login');
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthMessage({ text: "Email atau password salah.", type: 'error' });
        }
        setIsLoading(false);
      };

      const handleLogout = async () => {
        if (isSupabaseConfigured) await supabase.auth.signOut();
      };

      // TAMPILAN JIKA BELUM LOGIN
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans text-slate-800">
            <div className="bg-white max-w-md w-full rounded-3xl shadow-xl shadow-slate-200 border border-slate-100 overflow-hidden relative">
              {authMessage.text && (
                <div className={`absolute top-0 left-0 right-0 p-3 text-sm text-center font-medium ${authMessage.type === 'error' ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-white'}`}>
                  {authMessage.text}
                </div>
              )}
              <div className="bg-indigo-600 p-8 pt-12 text-center text-white">
                <div className="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                  <i className="fa-solid fa-wallet text-3xl text-white"></i>
                </div>
                <h1 className="text-2xl font-bold tracking-tight">FinansialKu</h1>
                <p className="text-indigo-200 mt-2 text-sm">Masuk untuk mencatat keuangan Anda</p>
              </div>
              
              <div className="p-8">
                <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                  <button onClick={() => {setAuthMode('login'); setAuthMessage({text:'', type:''})}} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode === 'login' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Masuk</button>
                  <button onClick={() => {setAuthMode('register'); setAuthMessage({text:'', type:''})}} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode === 'register' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Daftar</button>
                </div>

                <form onSubmit={handleAuth} className="space-y-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Nama Lengkap</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-user text-slate-400"></i></div>
                        <input type="text" value={name} onChange={(e) => setName(e.target.value)} required className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Nama Anda" />
                      </div>
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-envelope text-slate-400"></i></div>
                      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="nama@email.com" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Kata Sandi</label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-lock text-slate-400"></i></div>
                      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength="6" className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Minimal 6 karakter" />
                    </div>
                  </div>
                  <button type="submit" disabled={isLoading} className="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-medium py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
                    {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : (authMode === 'login' ? 'Masuk ke Akun' : 'Buat Akun Sekarang')}
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // TAMPILAN JIKA SUDAH LOGIN (DASHBOARD)
      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="bg-indigo-600 p-2 rounded-xl text-white"><i className="fa-solid fa-wallet text-xl"></i></div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">FinansialKu</h1>
              </div>
              <div className="flex items-center gap-4">
                <div className="hidden sm:block text-sm font-medium text-slate-500">
                  Halo, <span className="text-indigo-600 font-semibold">{user?.user_metadata?.name || user?.email?.split('@')[0]}</span>
                </div>
                <button onClick={handleLogout} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors flex items-center gap-2" title="Keluar">
                  <i className="fa-solid fa-right-from-bracket text-lg"></i>
                  <span className="hidden sm:inline text-sm font-medium">Keluar</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div className="bg-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-200 flex flex-col justify-between">
                <div className="flex items-center gap-2 text-indigo-100 mb-2">
                  <i className="fa-solid fa-wallet text-lg"></i><h2 className="font-medium">Total Saldo</h2>
                </div>
                <p className="text-3xl font-bold tracking-tight">{formatRupiah(balance)}</p>
              </div>
              <div className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col justify-between">
                <div className="flex items-center gap-2 text-slate-500 mb-2">
                  <div className="bg-emerald-100 p-1.5 rounded-lg text-emerald-600"><i className="fa-solid fa-arrow-trend-down"></i></div><h2 className="font-medium">Pemasukan</h2>
                </div>
                <p className="text-2xl font-bold text-slate-900">{formatRupiah(totalIncome)}</p>
              </div>
              <div className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col justify-between">
                <div className="flex items-center gap-2 text-slate-500 mb-2">
                  <div className="bg-rose-100 p-1.5 rounded-lg text-rose-600"><i className="fa-solid fa-arrow-trend-up"></i></div><h2 className="font-medium">Pengeluaran</h2>
                </div>
                <p className="text-2xl font-bold text-slate-900">{formatRupiah(totalExpense)}</p>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              <div className="lg:col-span-1">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sticky top-24">
                  <h3 className="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2"><i className="fa-solid fa-plus text-indigo-600"></i> Catat Transaksi</h3>
                  <form onSubmit={handleSubmit} className="space-y-5">
                    <div className="flex p-1 bg-slate-100 rounded-xl">
                      <button type="button" onClick={() => {setType('expense'); setCategory(categories['expense'][0])}} className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${type === 'expense' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pengeluaran</button>
                      <button type="button" onClick={() => {setType('income'); setCategory(categories['income'][0])}} className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${type === 'income' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pemasukan</button>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Nominal (Rp)</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span className="text-slate-400 font-medium">Rp</span></div>
                        <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" required min="1" className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Keterangan</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-file-lines text-slate-400"></i></div>
                        <input type="text" value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Contoh: Makan siang" required className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Kategori</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-tag text-slate-400"></i></div>
                        <select value={category} onChange={(e) => setCategory(e.target.value)} required className="block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
                          {categories[type].map((cat) => <option key={cat} value={cat}>{cat}</option>)}
                        </select>
                        <div className="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none"><svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg></div>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Tanggal</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i className="fa-solid fa-calendar text-slate-400"></i></div>
                        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required className="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                      </div>
                    </div>
                    <button type="submit" disabled={isLoading} className="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-medium py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
                      {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <><i className="fa-solid fa-plus"></i> Simpan Transaksi</>}
                    </button>
                  </form>
                </div>
              </div>

              <div className="lg:col-span-2">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                  <div className="flex items-center justify-between mb-6">
                    <h3 className="text-lg font-bold text-slate-900">Riwayat Transaksi</h3>
                    <span className="text-sm text-slate-500 bg-slate-100 px-3 py-1 rounded-full">{transactions.length} Transaksi</span>
                  </div>

                  {isLoading && transactions.length === 0 ? (
                    <div className="text-center py-16 px-4">
                      <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                      <p className="text-slate-500 font-medium">Memuat data...</p>
                    </div>
                  ) : transactions.length === 0 ? (
                    <div className="text-center py-16 px-4">
                      <div className="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-file-lines text-slate-300 text-3xl"></i></div>
                      <h4 className="text-slate-900 font-medium mb-1">Belum ada transaksi</h4>
                      <p className="text-slate-500 text-sm">Mulai catat pemasukan dan pengeluaran Anda.</p>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {transactions.map((t) => {
                        const isIncome = t.type === 'income';
                        return (
                          <div key={t.id} className="group flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-all gap-4">
                            <div className="flex items-center gap-4">
                              <div className={`p-3 rounded-xl flex-shrink-0 flex items-center justify-center w-12 h-12 ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                                {getCategoryIcon(t.category, t.type)}
                              </div>
                              <div>
                                <p className="text-slate-900 font-semibold">{t.description}</p>
                                <div className="flex items-center gap-2 text-sm text-slate-500 mt-0.5">
                                  <span className="bg-slate-100 px-2 py-0.5 rounded-md text-xs font-medium">{t.category}</span><span>•</span><span>{formatDate(t.date)}</span>
                                </div>
                              </div>
                            </div>
                            <div className="flex items-center justify-between sm:justify-end gap-6 pl-14 sm:pl-0">
                              <p className={`font-bold whitespace-nowrap ${isIncome ? 'text-emerald-600' : 'text-slate-900'}`}>{isIncome ? '+' : '-'}{formatRupiah(t.amount)}</p>
                              <button onClick={() => handleDelete(t.id)} className="text-slate-400 hover:text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition-colors sm:opacity-0 group-hover:opacity-100" title="Hapus"><i className="fa-solid fa-trash"></i></button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
